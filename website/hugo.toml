baseURL = 'https://localarabic.com'
languageCode = 'en-US'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
disableKinds = ['taxonomy', 'term']
title = 'Translito'

[params]
  seoTitle = 'Translito: live meeting subtitles in 18 languages for Windows and macOS'
  description = 'A native macOS and Windows app that translates system audio, microphones, and your spoken voice in real time with on-device intelligence.'
  author = 'Translito'
  version = '2.0.8'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[menu]
  [[menu.main]]
    name = 'Home'
    url = '/'
    weight = 10
  [[menu.main]]
    name = 'Features'
    url = '#features'
    weight = 20
  [[menu.main]]
    name = 'Setup'
    url = '#setup'
    weight = 30
  [[menu.main]]
    name = 'Download'
    url = '#download'
    weight = 40

