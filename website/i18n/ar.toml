[faqTitle]
other = "أسئلة"

[faq1Question]
other = "ما اللغات المدعومة؟"

[faq1Answer]
other = "الإنجليزية والألمانية والإسبانية والفرنسية والهولندية والنرويجية والبولندية والبرتغالية والسويدية والعربية والصينية المبسطة والتقليدية واليابانية والكورية، إضافة إلى الإيطالية والروسية والتركية والفارسية والأردية، في الاتجاهين. نقيس العربية إلى الإنجليزية في كل إصدار؛ ويقيس الفحص أي زوج آخر على جهازك."

[faq2Question]
other = "هل يجب أن أدفع؟"

[faq2Answer]
other = "لا. Translito مجاني عند العمل على هذا الجهاز. محركات السحابة اختيارية: تضيف مفتاحك الخاص وتدفع للمزوّد مقابل الكلام الذي يرسله Translito فقط، وتحدّد ميزانية شهرية."

[faq3Question]
other = "هل يعمل مع Zoom وTeams وMeet؟"

[faq3Answer]
other = "نعم. اختر تطبيق الاجتماعات مرة واحدة، وسيستمع Translito إلى صوته. وللاجتماعات في المتصفح، يستمع إلى المتصفح."

[faq4Question]
other = "إلى أين يذهب صوتي؟"

[faq4Answer]
other = "عند العمل على هذا الجهاز، لا يذهب إلى أي مكان. ومع محرك سحابي، يُرسَل الكلام بلغتيك فقط إلى المزوّد الذي ربطته."

