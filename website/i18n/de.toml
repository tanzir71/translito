[faqTitle]
other = "Fragen"

[faq1Question]
other = "Welche Sprachen werden unterstützt?"

[faq1Answer]
other = "Englisch, Deutsch, Spanisch, Französisch, Niederländisch, Norwegisch, Polnisch, Portugiesisch, Schwedisch, Arabisch, Chinesisch mit vereinfachten und traditionellen Zeichen, Japanisch und Koreanisch sowie Italienisch, Russisch, Türkisch, Persisch und Urdu, in beide Richtungen. Arabisch nach Englisch wird bei jeder Veröffentlichung gemessen; andere Paare testet die Prüfung auf Ihrem PC."

[faq2Question]
other = "Muss ich bezahlen?"

[faq2Answer]
other = "Nein. Auf diesem PC ist Translito kostenlos. Cloud-Engines sind optional: Sie fügen Ihren eigenen Schlüssel hinzu, bezahlen dem Anbieter nur die von Translito gesendete Sprache und legen ein Monatsbudget fest."

[faq3Question]
other = "Funktioniert es mit Zoom, Teams und Meet?"

[faq3Answer]
other = "Ja. Wählen Sie Ihre Meeting-App einmal aus; Translito hört deren Audio zu. Bei Meetings im Browser hört es dem Browser zu."

[faq4Question]
other = "Wohin geht mein Audio?"

[faq4Answer]
other = "Bei lokaler Verarbeitung nirgendwohin. Mit einer Cloud-Engine geht nur Sprache in Ihren zwei Sprachen an den von Ihnen verbundenen Anbieter."

