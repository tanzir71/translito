[feature1Title]
other = "Subtitles that stay on top"

[feature1Body]
other = "Keep the meeting full screen and Translito in the tray. The translation sits in a slim bar over everything, with the previous line above the current one."

[feature1Bullet1]
other = "Clicks pass through, so the meeting stays usable"

[feature1Bullet2]
other = "Drag it anywhere; its place is remembered for each screen"

[feature1Bullet3]
other = "Switch it on from the app, the tray, a shortcut or settings"

[feature1Bullet4]
other = "Text size, number of lines and the original line are your choice"

[feature1Alt]
other = "Translito subtitle settings for placement, text size and displayed lines."

[feature2Title]
other = "Starts when your meeting does"

[feature2Body]
other = "Paste your calendar's private link or set weekly times. Translito starts a minute before, listens to your default meeting app and stops when the meeting ends."

[feature2Bullet1]
other = "Waits until the meeting app plays sound, so a no-show costs nothing"

[feature2Bullet2]
other = "Your meeting app is remembered: Zoom, Teams or a browser"

[feature2Bullet3]
other = "A notice with Stop appears at every automatic start"

[feature2Alt]
other = "Translito schedule settings for a calendar link, weekly times and a meeting app."

[feature3Title]
other = "Reply in their language"

[feature3Body]
other = "When someone asks you something, Translito suggests three short replies in their language, written in English letters with the meaning underneath."

[feature3Bullet1]
other = "Say one with Ctrl + Alt + 1, 2 or 3, through Speak mode"

[feature3Bullet2]
other = "Shortcuts are yours to change"

[feature3Bullet3]
other = "Shown under the subtitle bar too, so they work with the app minimized"

[feature3Bullet4]
other = "A small built-in phrasebook covers you without a cloud engine"

