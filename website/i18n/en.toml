[faqTitle]
other = "Questions"

[faq1Question]
other = "Which languages work?"

[faq1Answer]
other = "English, German, Spanish, French, Dutch, Norwegian, Polish, Portuguese, Swedish, Arabic, Chinese (Simplified and Traditional), Japanese and Korean, plus Italian, Russian, Turkish, Persian and Urdu, in either direction. Arabic to English is measured on every release; the check measures any other pair on your PC."

[faq2Question]
other = "Do I have to pay?"

[faq2Answer]
other = "No. On this PC Translito is free. Cloud engines are optional: you add your own key, pay the provider only for the speech Translito sends, and set a monthly budget."

[faq3Question]
other = "Does it work with Zoom, Teams and Meet?"

[faq3Answer]
other = "Yes. Choose your meeting app once and Translito listens to its audio. For meetings in a browser, it listens to the browser."

[faq4Question]
other = "Where does my audio go?"

[faq4Answer]
other = "On this PC, nowhere. With a cloud engine, only speech in your two languages goes to the provider you connected."

