[feature2Title]
other = "Empieza cuando comienza tu reunión"

[feature2Body]
other = "Pega el enlace privado de tu calendario o define horarios semanales. Translito empieza un minuto antes, escucha tu app de reuniones predeterminada y se detiene cuando termina la reunión."

[feature2Bullet1]
other = "Espera hasta que la app reproduzca sonido, así que una reunión sin participantes no cuesta nada"

[feature2Bullet2]
other = "Recuerda tu app de reuniones: Zoom, Teams o un navegador"

[feature2Bullet3]
other = "Muestra un aviso con Stop cada vez que inicia automáticamente"

[feature2Alt]
other = "Ajustes de programación de Translito para calendario, horarios semanales y app de reuniones."

[feature3Title]
other = "Responde en su idioma"

[feature3Body]
other = "Cuando alguien te pregunta algo, Translito sugiere tres respuestas cortas en su idioma, escritas en letras inglesas y con el significado debajo."

[feature3Bullet1]
other = "Di una con Ctrl + Alt + 1, 2 o 3 mediante el modo Speak"

[feature3Bullet2]
other = "Puedes cambiar los atajos"

[feature3Bullet3]
other = "También aparecen debajo de la barra de subtítulos para usarlas con la app minimizada"

[feature3Bullet4]
other = "Un pequeño libro de frases integrado te ayuda sin un motor en la nube"

