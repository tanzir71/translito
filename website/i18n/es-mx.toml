[languagesIntro]
other = "Elige dos idiomas. El inglés de la reunión puede mostrarse tal cual. El chino admite caracteres simplificados y tradicionales."

[languagesAlso]
other = "También compatibles"

[languagesAccuracy]
other = "La cobertura de idiomas y la precisión medida son cosas distintas. Medimos árabe a inglés en cada versión. Para otros pares, la prueba integrada mide el retraso y la precisión en tu propia PC antes de que pagues por algo."

[howTitle]
other = "Configúralo una sola vez"

[how1Title]
other = "Instala"

[how1Body]
other = "Un instalador de Windows o un ZIP portátil, o una app universal para Mac."

[how2Title]
other = "Elige los idiomas y tu app"

[how2Body]
other = "Selecciona lo que se habla y lo que quieres leer. Translito recuerda ambos."

[how3Title]
other = "Únete a tu reunión"

[how3Body]
other = "Presiona Start o deja que la programación lo inicie. Los subtítulos aparecen al frente."

[faqTitle]
other = "Preguntas"

[faq1Question]
other = "¿Qué idiomas son compatibles?"

[faq1Answer]
other = "Inglés, alemán, español, francés, neerlandés, noruego, polaco, portugués, sueco, árabe, chino simplificado y tradicional, japonés y coreano, además de italiano, ruso, turco, persa y urdu, en ambas direcciones. El árabe a inglés se mide en cada versión; los demás pares se pueden probar en tu PC."

[faq2Question]
other = "¿Tengo que pagar?"

[faq2Answer]
other = "No. Translito es gratis en esta PC. Los motores en la nube son opcionales: agregas tu propia clave, pagas al proveedor solo por la voz que envía Translito y defines un presupuesto mensual."

[faq3Question]
other = "¿Funciona con Zoom, Teams y Meet?"

[faq3Answer]
other = "Sí. Elige tu app de reuniones una vez y Translito escucha su audio. Para reuniones en un navegador, escucha el navegador."

[faq4Question]
other = "¿A dónde va mi audio?"

[faq4Answer]
other = "A ningún lado cuando se procesa en esta PC. Con un motor en la nube, solo se envía voz en tus dos idiomas al proveedor que conectaste."

