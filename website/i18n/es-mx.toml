other = "Subtítulos que siempre están al frente"

[feature1Body]
other = "Deja la reunión en pantalla completa y Translito en la bandeja del sistema. La traducción aparece en una barra delgada sobre todo, con la línea anterior encima de la actual."

[feature1Bullet1]
other = "Los clics atraviesan la barra para que puedas seguir usando la reunión"

[feature1Bullet2]
other = "Arrástrala a donde quieras; se recuerda su posición en cada pantalla"

[feature1Bullet3]
other = "Actívala desde la app, la bandeja, un atajo o los ajustes"

[feature1Bullet4]
