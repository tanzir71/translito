other = "Consultez le délai et le coût de chaque moteur. Fixez un budget mensuel."

[feature1Title]
other = "Des sous-titres toujours au premier plan"

[feature1Body]
other = "Gardez la réunion en plein écran et Translito dans la zone de notification. La traduction apparaît dans une fine barre au-dessus de tout, avec la ligne précédente au-dessus de la ligne actuelle."

[feature1Bullet1]
other = "Les clics traversent la barre pour laisser la réunion utilisable"

[feature1Bullet2]
other = "Déplacez-la où vous voulez ; sa position est mémorisée pour chaque écran"

[feature1Bullet3]
other = "Activez-la depuis l’application, la zone de notification, un raccourci ou les réglages"

[feature1Bullet4]
other = "Choisissez la taille du texte, le nombre de lignes et l’affichage de l’original"

[feature1Alt]
other = "Réglages des sous-titres Translito : position, taille du texte et lignes affichées."

[feature2Title]
other = "Démarre quand votre réunion commence"

[feature2Body]
other = "Collez le lien privé de votre calendrier ou définissez des horaires hebdomadaires. Translito démarre une minute avant, écoute votre application de réunion par défaut et s’arrête à la fin de la réunion."

[feature2Bullet1]
other = "Attend que l’application émette du son ; une réunion sans participants ne coûte rien"

[feature2Bullet2]
other = "Mémorise votre application : Zoom, Teams ou un navigateur"

[feature2Bullet3]
other = "Un avis avec Stop apparaît à chaque démarrage automatique"

[feature2Alt]
other = "Réglages de planification Translito pour le calendrier, les horaires hebdomadaires et l’application de réunion."

[feature3Title]
other = "Répondez dans leur langue"

[feature3Body]
other = "Quand quelqu’un vous pose une question, Translito propose trois réponses courtes dans sa langue, écrites en lettres anglaises avec leur sens en dessous."

[feature3Bullet1]
other = "Prononcez-en une avec Ctrl + Alt + 1, 2 ou 3, via le mode Speak"

[feature3Bullet2]
other = "Modifiez les raccourcis à votre guise"

[feature3Bullet3]
other = "Elles apparaissent aussi sous la barre de sous-titres pour fonctionner lorsque l’application est réduite"

[feature3Bullet4]
other = "Un petit guide de conversation intégré vous aide sans moteur cloud"

[replyCardTitle]
other = "Pouvez-vous répéter la question ?"

[replyCardCaption]
other = "Des réponses en anglais et leur sens en français"

[replyLatinNote]
other = "Cette langue utilise l’alphabet latin : la réponse est affichée telle qu’elle s’écrit"

[replyFootnote]
other = "Les langues utilisant une autre écriture disposent aussi d’une version en lettres anglaises pour vous aider à prononcer la réponse."

[replyMeaning1]
other = "Oui, jeudi me convient"

[replyMeaning2]
other = "Donnez-moi deux jours et je vous confirme"

[replyMeaning3]
other = "Pouvez-vous répéter la question ?"

[feature4Title]
other = "Connaissez le coût et la vitesse avant de choisir"

[feature4Body]
other = "Utilisez Translito gratuitement sur votre PC, ou connectez un moteur cloud avec votre propre clé pour gagner en vitesse et en précision. Vous payez directement le fournisseur, uniquement pour la parole envoyée par Translito."

[feature4Bullet1]
other = "Un test intégré mesure le délai et la précision sur votre PC"

[feature4Bullet2]
other = "Les silences, la musique et les autres langues ne sont jamais envoyés"

[feature4Bullet3]
other = "Fixez un budget mensuel, puis revenez au PC ou arrêtez le traitement"

[feature4Bullet4]
other = "Choisissez le fournisseur et le modèle par défaut pour chaque paire de langues"

[feature4Alt]
other = "Réglages des moteurs Translito pour comparer vitesse, précision et coût en local et dans le cloud."

[feature5Title]
other = "Des réglages clairs qui restent en place"

[feature5Body]
other = "Les réglages sont regroupés par tâche : langues, moteur, coût, sous-titres, planification et audio. Chaque changement est enregistré immédiatement."

[feature5Bullet1]
other = "Un même sélecteur pour la langue parlée et celle que vous souhaitez lire"

[feature5Bullet2]
other = "L’anglais parlé en réunion est affiché tel quel, sans traduction"

[feature5Bullet3]
other = "Votre propre liste de termes pour les noms et le jargon"

[feature5Alt]
other = "Réglages des langues Translito et barre latérale organisée par catégorie."

