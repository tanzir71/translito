other = "Parlez pendant les appels"

[also1Body]
other = "Votre voix traduite arrive dans Zoom, Teams ou Meet grâce à un microphone virtuel."

[also2Title]
other = "L’audio de n’importe quelle application"

[also2Body]
other = "Écoutez une application ou tout ce que votre ordinateur diffuse."

[also3Title]
other = "Des transcriptions enregistrées"

[also3Body]
other = "Chaque session est enregistrée avec des horodatages dans le dossier de votre choix."

[also4Title]
other = "Privé sur votre PC"

[also4Body]
other = "En traitement local, rien ne quitte votre ordinateur une fois les modèles téléchargés."

[also5Title]
other = "Les raccourcis de votre choix"

[also5Body]
other = "Démarrage, arrêt, sous-titres et réponses : toutes les combinaisons peuvent être enregistrées."

[also6Title]
other = "Barre de menus et zone de notification"

[also6Body]
other = "Les commandes restent à un clic sur macOS et Windows."

[languagesTitle]
other = "18 langues, dans les deux sens"

[languagesIntro]
other = "Choisissez deux langues. L’anglais parlé en réunion peut rester inchangé. Le chinois est disponible en caractères simplifiés et traditionnels."

[languagesAlso]
other = "Également pris en charge"

[languagesAccuracy]
other = "La couverture linguistique et la précision mesurée sont deux choses distinctes. Nous mesurons l’arabe vers l’anglais à chaque version. Pour les autres paires, le test intégré mesure le délai et la précision sur votre PC avant que vous ne payiez quoi que ce soit."

[howTitle]
other = "Configurez-le une seule fois"

[how1Title]
other = "Installez"

[how1Body]
other = "Un programme d’installation Windows ou un ZIP portable, ou une application universelle pour Mac."

[how2Title]
other = "Choisissez les langues et votre application"

[how2Body]
other = "Sélectionnez la langue parlée et celle que vous souhaitez lire. Translito mémorise les deux."

[how3Title]
other = "Rejoignez votre réunion"

[how3Body]
other = "Appuyez sur Start ou laissez la planification démarrer. Les sous-titres apparaissent au premier plan."

[faqTitle]
other = "Questions"

[faq1Question]
other = "Quelles langues sont disponibles ?"

[faq1Answer]
other = "Anglais, allemand, espagnol, français, néerlandais, norvégien, polonais, portugais, suédois, arabe, chinois simplifié et traditionnel, japonais et coréen, ainsi qu’italien, russe, turc, persan et ourdou, dans les deux sens. L’arabe vers l’anglais est mesuré à chaque version ; les autres paires peuvent être testées sur votre PC."

[faq2Question]
other = "Faut-il payer ?"

[faq2Answer]
other = "Non. Translito est gratuit sur ce PC. Les moteurs cloud sont facultatifs : vous ajoutez votre clé, payez le fournisseur uniquement pour la parole envoyée par Translito et définissez un budget mensuel."

[faq3Question]
other = "Est-ce compatible avec Zoom, Teams et Meet ?"

[faq3Answer]
other = "Oui. Choisissez votre application de réunion une fois, puis Translito écoute son audio. Pour les réunions dans un navigateur, il écoute le navigateur."

[faq4Question]
other = "Où va mon audio ?"

[faq4Answer]
other = "Nulle part en traitement local. Avec un moteur cloud, seule la parole dans vos deux langues est envoyée au fournisseur que vous avez connecté."

