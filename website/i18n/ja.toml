[faqTitle]
other = "よくある質問"

[faq1Question]
other = "どの言語に対応していますか？"

[faq1Answer]
other = "英語、ドイツ語、スペイン語、フランス語、オランダ語、ノルウェー語、ポーランド語、ポルトガル語、スウェーデン語、アラビア語、中国語の簡体字と繁体字、日本語、韓国語に加え、イタリア語、ロシア語、トルコ語、ペルシア語、ウルドゥー語に双方向で対応しています。アラビア語から英語はリリースごとに測定し、その他は自分の PC でチェックできます。"

[faq2Question]
other = "料金はかかりますか？"

[faq2Answer]
other = "この PC で Translito を使う場合は無料です。クラウドエンジンは任意です。自分のキーを追加し、Translito が送信した音声の分だけ提供元に支払い、月額予算を設定できます。"

[faq3Question]
other = "Zoom、Teams、Meet で使えますか？"

[faq3Answer]
other = "はい。会議アプリを一度選べば、Translito がその音声を聞き取ります。ブラウザー上の会議では、ブラウザーの音声を聞き取ります。"

[faq4Question]
other = "音声はどこに送られますか？"

[faq4Answer]
other = "この PC で処理する場合は外に送られません。クラウドエンジンを使う場合は、選択した2言語の音声だけを、接続した提供元に送信します。"

