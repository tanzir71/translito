[faqTitle]
other = "자주 묻는 질문"

[faq1Question]
other = "어떤 언어를 지원하나요?"

[faq1Answer]
other = "영어, 독일어, 스페인어, 프랑스어, 네덜란드어, 노르웨이어, 폴란드어, 포르투갈어, 스웨덴어, 아랍어, 중국어 간체와 번체, 일본어, 한국어와 함께 이탈리아어, 러시아어, 튀르키예어, 페르시아어, 우르두어를 양방향으로 지원합니다. 아랍어에서 영어는 릴리스마다 측정하며, 다른 언어 쌍은 PC에서 검사할 수 있습니다."

[faq2Question]
other = "비용을 내야 하나요?"

[faq2Answer]
other = "아니요. 이 PC에서 Translito를 사용하는 것은 무료입니다. 클라우드 엔진은 선택 사항입니다. 본인의 키를 추가하고 월 예산을 정해, Translito가 보낸 음성만큼만 제공업체에 비용을 냅니다."

[faq3Question]
other = "Zoom, Teams, Meet에서 작동하나요?"

[faq3Answer]
other = "네. 회의 앱을 한 번 선택하면 Translito가 그 앱의 음성을 듣습니다. 브라우저 회의는 브라우저의 오디오를 듣습니다."

[faq4Question]
other = "내 오디오는 어디로 가나요?"

[faq4Answer]
other = "이 PC에서 처리할 때는 밖으로 나가지 않습니다. 클라우드 엔진을 사용하면 선택한 두 언어의 음성만 연결한 제공업체로 전송됩니다."

