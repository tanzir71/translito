[faqTitle]
other = "Spørsmål"

[faq1Question]
other = "Hvilke språk støttes?"

[faq1Answer]
other = "Engelsk, tysk, spansk, fransk, nederlandsk, norsk, polsk, portugisisk, svensk, arabisk, kinesisk med forenklede og tradisjonelle tegn, japansk og koreansk, samt italiensk, russisk, tyrkisk, persisk og urdu, i begge retninger. Arabisk til engelsk måles ved hver utgivelse; andre par kan sjekkes på PC-en din."

[faq2Question]
other = "Må jeg betale?"

[faq2Answer]
other = "Nei. Translito er gratis på denne PC-en. Skymotorer er valgfrie: Du legger til din egen nøkkel, betaler leverandøren bare for talen Translito sender, og setter et månedsbudsjett."

[faq3Question]
other = "Fungerer det med Zoom, Teams og Meet?"

[faq3Answer]
other = "Ja. Velg møteappen én gang, så lytter Translito til lyden. For møter i en nettleser lytter den til nettleseren."

[faq4Question]
other = "Hvor sendes lyden min?"

[faq4Answer]
other = "Ingen steder ved behandling på denne PC-en. Med en skymotor sendes bare tale på de to valgte språkene til leverandøren du har koblet til."

