other = "Start wanneer je vergadering begint"

[feature2Body]
other = "Plak de privélink van je kalender of stel wekelijkse tijden in. Translito start een minuut van tevoren, luistert naar je standaardvergaderapp en stopt als de vergadering eindigt."

[feature2Bullet1]
other = "Wacht tot de vergaderapp geluid afspeelt, zodat een vergadering zonder deelnemers niets kost"

