[faqTitle]
other = "Vragen"

[faq1Question]
other = "Welke talen werken?"

[faq1Answer]
other = "Engels, Duits, Spaans, Frans, Nederlands, Noors, Pools, Portugees, Zweeds, Arabisch, Chinees met vereenvoudigde en traditionele tekens, Japans en Koreaans, plus Italiaans, Russisch, Turks, Perzisch en Urdu, in beide richtingen. Arabisch naar Engels wordt bij elke release gemeten; andere paren kun je op je pc controleren."

[faq2Question]
other = "Moet ik betalen?"

[faq2Answer]
other = "Nee. Op deze pc is Translito gratis. Cloudengines zijn optioneel: je voegt je eigen sleutel toe, betaalt de aanbieder alleen voor de spraak die Translito verstuurt en stelt een maandbudget in."

[faq3Question]
other = "Werkt het met Zoom, Teams en Meet?"

[faq3Answer]
other = "Ja. Kies je vergaderapp één keer en Translito luistert naar de audio. Bij vergaderingen in een browser luistert het naar de browser."

[faq4Question]
other = "Waar gaat mijn audio naartoe?"

[faq4Answer]
other = "Bij verwerking op deze pc nergens heen. Met een cloudengine gaat alleen spraak in je twee talen naar de aanbieder die je hebt verbonden."

