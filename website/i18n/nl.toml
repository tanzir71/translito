[feature1Body]
other = "Houd je vergadering op volledig scherm en Translito in het systeemvak. De vertaling staat in een smalle balk boven alles, met de vorige regel boven de huidige."

[feature1Bullet1]
other = "Klikken gaan door de balk heen, zodat de vergadering bruikbaar blijft"

[feature1Bullet2]
other = "Sleep hem waar je wilt; de positie wordt per scherm onthouden"

[feature1Bullet3]
