[faqTitle]
other = "Pytania"

[faq1Question]
other = "Jakie języki są obsługiwane?"

[faq1Answer]
other = "Angielski, niemiecki, hiszpański, francuski, niderlandzki, norweski, polski, portugalski, szwedzki, arabski, chiński uproszczony i tradycyjny, japoński i koreański, a także włoski, rosyjski, turecki, perski i urdu, w obu kierunkach. Arabski na angielski jest mierzony przy każdym wydaniu; inne pary można przetestować na swoim komputerze."

[faq2Question]
other = "Czy muszę płacić?"

[faq2Answer]
other = "Nie. Translito jest bezpłatne na tym komputerze. Silniki chmurowe są opcjonalne: dodajesz własny klucz, płacisz dostawcy tylko za mowę wysłaną przez Translito i ustalasz miesięczny budżet."

[faq3Question]
other = "Czy działa z Zoom, Teams i Meet?"

[faq3Answer]
other = "Tak. Wybierz aplikację do spotkań raz, a Translito będzie słuchać jej dźwięku. W przypadku spotkań w przeglądarce słucha przeglądarki."

[faq4Question]
other = "Dokąd trafia mój dźwięk?"

[faq4Answer]
other = "Nigdzie przy przetwarzaniu na tym komputerze. Z silnikiem chmurowym tylko mowa w Twoich dwóch językach trafia do połączonego dostawcy."

