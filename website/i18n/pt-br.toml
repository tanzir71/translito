[faqTitle]
other = "Perguntas"

[faq1Question]
other = "Quais idiomas são compatíveis?"

[faq1Answer]
other = "Inglês, alemão, espanhol, francês, holandês, norueguês, polonês, português, sueco, árabe, chinês simplificado e tradicional, japonês e coreano, além de italiano, russo, turco, persa e urdu, nos dois sentidos. Árabe para inglês é medido a cada versão; os demais pares podem ser testados no seu PC."

[faq2Question]
other = "Preciso pagar?"

[faq2Answer]
other = "Não. O Translito é grátis neste PC. Os mecanismos de nuvem são opcionais: você adiciona sua própria chave, paga ao provedor apenas pela fala que o Translito envia e define um orçamento mensal."

[faq3Question]
other = "Funciona com Zoom, Teams e Meet?"

[faq3Answer]
other = "Sim. Escolha seu aplicativo de reuniões uma vez, e o Translito ouvirá o áudio dele. Para reuniões no navegador, ele ouve o navegador."

[faq4Question]
other = "Para onde vai meu áudio?"

[faq4Answer]
other = "Não sai daqui no processamento neste PC. Com um mecanismo de nuvem, apenas a fala nos seus dois idiomas vai para o provedor conectado."

