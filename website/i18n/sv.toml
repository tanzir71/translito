[faqTitle]
other = "Frågor"

[faq1Question]
other = "Vilka språk stöds?"

[faq1Answer]
other = "Engelska, tyska, spanska, franska, nederländska, norska, polska, portugisiska, svenska, arabiska, kinesiska med förenklade och traditionella tecken, japanska och koreanska samt italienska, ryska, turkiska, persiska och urdu, i båda riktningarna. Arabiska till engelska mäts vid varje version; andra par kan testas på din dator."

[faq2Question]
other = "Måste jag betala?"

[faq2Answer]
other = "Nej. Translito är gratis på den här datorn. Molnmotorer är valfria: Du lägger till din egen nyckel, betalar leverantören bara för talet Translito skickar och sätter en månadsbudget."

[faq3Question]
other = "Fungerar det med Zoom, Teams och Meet?"

[faq3Answer]
other = "Ja. Välj mötesapp en gång så lyssnar Translito på dess ljud. Vid möten i webbläsaren lyssnar den på webbläsaren."

[faq4Question]
other = "Vart skickas mitt ljud?"

[faq4Answer]
other = "Ingenstans vid bearbetning på den här datorn. Med en molnmotor skickas bara tal på dina två språk till leverantören du har anslutit."

