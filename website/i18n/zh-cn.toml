[faqTitle]
other = "常见问题"

[faq1Question]
other = "支持哪些语言？"

[faq1Answer]
other = "支持英语、德语、西班牙语、法语、荷兰语、挪威语、波兰语、葡萄牙语、瑞典语、阿拉伯语、中文简体和繁体、日语、韩语，以及意大利语、俄语、土耳其语、波斯语和乌尔都语，均可双向使用。阿拉伯语到英语每次发布都会测量；其他组合可在自己的电脑上检查。"

[faq2Question]
other = "需要付费吗？"

[faq2Answer]
other = "不需要。本机运行 Translito 免费。云端引擎可选：添加自己的密钥，设置每月预算，只向服务商支付 Translito 发送的语音费用。"

[faq3Question]
other = "能与 Zoom、Teams 和 Meet 一起使用吗？"

[faq3Answer]
other = "可以。只需选择一次会议应用，Translito 就会聆听它的音频。若会议在浏览器中进行，则聆听浏览器。"

[faq4Question]
other = "我的音频会发送到哪里？"

[faq4Answer]
other = "使用本机处理时，不会发送到外部。使用云端引擎时，仅会把你所选两种语言的语音发送给已连接的服务商。"

