[faqTitle]
other = "常見問題"

[faq1Question]
other = "支援哪些語言？"

[faq1Answer]
other = "支援英語、德語、西班牙語、法語、荷蘭語、挪威語、波蘭語、葡萄牙語、瑞典語、阿拉伯語、簡體與繁體中文、日語、韓語，以及義大利語、俄語、土耳其語、波斯語和烏爾都語，皆可雙向使用。阿拉伯語到英語每次發佈都會測量；其他組合可在自己的電腦上檢查。"

[faq2Question]
other = "需要付費嗎？"

[faq2Answer]
other = "不需要。在本機執行 Translito 免費。雲端引擎可自由選用：加入自己的金鑰，設定每月預算，只向服務供應商支付 Translito 傳送的語音費用。"

[faq3Question]
other = "能與 Zoom、Teams 和 Meet 一起使用嗎？"

[faq3Answer]
other = "可以。只需選擇一次會議應用程式，Translito 就會聆聽它的音訊。若會議在瀏覽器中進行，則聆聽瀏覽器。"

[faq4Question]
other = "我的音訊會傳到哪裡？"

[faq4Answer]
other = "使用本機處理時，不會傳到外部。使用雲端引擎時，只會將你選擇的兩種語言的語音，傳給已連接的服務供應商。"

