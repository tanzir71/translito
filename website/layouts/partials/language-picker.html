<div class="language-picker">
  <button type="button" id="locale-toggle" aria-controls="locale-menu" aria-expanded="false" aria-label="{{ i18n "chooseLanguage" }}" hidden>
    <img src="{{ "img/landing/icons/globe.svg" | relURL }}" alt=""> {{ .Site.Language.Lang | upper }} <img src="{{ "img/landing/icons/chevron.svg" | relURL }}" alt="">
  </button>
  <details id="locale-fallback">
    <summary aria-label="{{ i18n "chooseLanguage" }}"><img src="{{ "img/landing/icons/globe.svg" | relURL }}" alt=""> {{ .Site.Language.Lang | upper }} <img src="{{ "img/landing/icons/chevron.svg" | relURL }}" alt=""></summary>
    <div class="locale-panel" id="locale-menu" aria-labelledby="locale-heading">
      <p id="locale-heading" class="locale-label">{{ i18n "languageLabel" }}</p>
      <ul>
        {{ $current := .Site.Language.Lang }}
        {{ range .Site.Sites }}
        <li><a href="{{ .Home.RelPermalink }}" lang="{{ .Language.LanguageCode }}" hreflang="{{ .Language.LanguageCode }}" data-locale-choice="{{ .Language.Lang }}" {{ if eq .Language.Lang $current }}aria-current="page"{{ end }}><span class="locale-name">{{ .Language.LanguageName }}</span><span class="locale-code">{{ .Language.Lang | upper }}</span></a></li>
        {{ end }}
      </ul>
      <p class="locale-remembered">{{ i18n "remembered" }}</p>
    </div>
  </details>
</div>
